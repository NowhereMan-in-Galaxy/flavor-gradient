<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方向一 · 浑天</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet" />
<script src="data.js"></script>
<style>
  :root {
    --ink: #10141f; --ink2: #171c2b; --bone: #e6dfcf; --bone-dim: #a39d8f; --line: rgba(230, 223, 207, .16);
    --gold: #c2a165; --cinnabar: #c9472f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: radial-gradient(120% 90% at 30% 20%, #1a2133 0%, var(--ink) 60%); color: var(--bone); font: 15px/1.7 'Noto Sans SC', sans-serif; min-height: 100vh; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; min-height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 28px; padding: 26px 40px 0; }
  h1 { font: 900 30px/1 'Noto Serif SC', serif; letter-spacing: .14em; }
  h1 small { font: 500 15px 'Cormorant Garamond', serif; letter-spacing: .2em; color: var(--bone-dim); margin-left: 10px; }
  .presets { margin-left: auto; display: flex; gap: 4px; }
  .presets button { background: none; border: 0; color: var(--bone-dim); font: 14px 'Noto Serif SC', serif; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid transparent; }
  .presets button[aria-pressed=true] { color: var(--bone); border-color: var(--cinnabar); }
  .map { position: relative; padding: 8px 12px 24px 28px; }
  .map svg { width: 100%; height: auto; display: block; }
  .legend { position: absolute; left: 48px; bottom: 34px; font: 12px 'Noto Serif SC', serif; color: var(--bone-dim); line-height: 1.9; }
  .star { cursor: pointer; transition: transform .6s cubic-bezier(.2, .8, .2, 1); transform-box: fill-box; transform-origin: center; }
  .star:hover { filter: drop-shadow(0 0 6px rgba(194, 161, 101, .9)); }
  .const { stroke: var(--gold); stroke-width: .8; opacity: 0; transition: opacity .4s; }
  .const.on { opacity: .85; }
  .lbl { font: 12px 'Noto Serif SC', serif; fill: var(--bone-dim); pointer-events: none; transition: fill .3s; }
  .lbl.on { fill: var(--bone); }
  aside { border-left: 1px solid var(--line); padding: 18px 36px 36px; background: linear-gradient(180deg, rgba(23, 28, 43, .6), rgba(16, 20, 31, 0)); }
  .kicker { font: 12px 'Noto Serif SC', serif; color: var(--gold); letter-spacing: .3em; }
  .title { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 0 2px; }
  .title h2 { font: 600 26px/1.2 'Noto Serif SC', serif; }
  .title .local { color: var(--bone-dim); font-size: 13px; }
  .seal { width: 54px; height: 54px; border: 1.5px solid var(--cinnabar); color: var(--cinnabar); display: grid; place-items: center; font: 500 22px 'Cormorant Garamond', serif; transform: rotate(-4deg); flex-shrink: 0; }
  .vibe { color: var(--bone-dim); font-size: 14px; }
  #mandala { width: 100%; height: auto; display: block; margin: 6px 0 4px; }
  .dishes { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  .dishes h3 { font: 600 13px 'Noto Serif SC', serif; letter-spacing: .2em; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .dishes h3.c { color: var(--cinnabar); }
  .dishes li { list-style: none; font-size: 14px; margin-bottom: 8px; }
  .dishes li span { display: block; color: var(--bone-dim); font-size: 12px; line-height: 1.5; }
  ul { padding: 0; }
  .ring { transition: d .7s; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; padding: 18px 16px 0; gap: 8px; }
    .presets { margin-left: 0; overflow-x: auto; max-width: 100%; }
    .map { padding: 4px 0 8px; }
    .legend { display: none; }
    aside { border-left: 0; border-top: 1px solid var(--line); padding: 18px 16px 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>浑天食图<small>FLAVOR GRADIENT</small></h1>
    <nav class="presets" id="presets"></nav>
  </header>
  <section class="map">
    <svg id="map" role="img" aria-label="风味星图"></svg>
    <div class="legend">星愈大愈亮，愈合你的胃口<br />金线为相邻风味的星宿连线</div>
  </section>
  <aside id="detail"></aside>
</div>
<script>
const D = window.FG, NS = 'http://www.w3.org/2000/svg';
let preset = D.presets[0].id, sel = 'cn-chaoshan';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const byId = Object.fromEntries(D.nodes.map((n) => [n.id, n]));

// ---- 星图 ----
const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${D.W} ${D.H}`);
const defs = el('defs', {}, svg);
const pat = el('pattern', { id: 'hatch', width: 4, height: 4, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(35)' }, defs);
el('line', { x1: 0, y1: 0, x2: 0, y2: 4, stroke: 'rgba(230,223,207,.22)', 'stroke-width': .7 }, pat);
el('path', { d: D.sphere, fill: 'none', stroke: 'rgba(230,223,207,.28)', 'stroke-width': 1 }, svg);
el('path', { d: D.grat, fill: 'none', stroke: 'rgba(230,223,207,.09)', 'stroke-width': .6, 'stroke-dasharray': '1 3' }, svg);
el('path', { d: D.land, fill: 'url(#hatch)', stroke: 'rgba(230,223,207,.32)', 'stroke-width': .5 }, svg);
const gConst = el('g', {}, svg), gStars = el('g', {}, svg), gLbl = el('g', {}, svg);
const consts = [];
D.nodes.forEach((a) => a.neighbors.forEach((bid) => { const b = byId[bid]; if (!b || a.id > bid && b.neighbors.includes(a.id)) return;
  consts.push({ a: a.id, b: bid, e: el('path', { d: `M${a.x} ${a.y}Q${(a.x + b.x) / 2} ${(a.y + b.y) / 2 - Math.hypot(b.x - a.x, b.y - a.y) * .25} ${b.x} ${b.y}`, fill: 'none', class: 'const' }, gConst) }); }));
const starPath = (r) => { const s = r * .28; return `M0 ${-r} Q${s} ${-s} ${r} 0 Q${s} ${s} 0 ${r} Q${-s} ${s} ${-r} 0 Q${-s} ${-s} 0 ${-r}Z`; };
const stars = {}, labels = {};
D.nodes.forEach((n) => {
  const g = el('g', { transform: `translate(${n.x} ${n.y})`, tabindex: 0, role: 'button', 'aria-label': n.name.zh }, gStars);
  const s = el('path', { class: 'star', fill: '#e6dfcf' }, g);
  el('circle', { r: 14, fill: 'transparent' }, g);
  g.addEventListener('mouseenter', () => light(n.id)); g.addEventListener('mouseleave', () => light(sel));
  g.addEventListener('click', () => select(n.id)); g.addEventListener('keydown', (e) => e.key === 'Enter' && select(n.id));
  stars[n.id] = s;
  labels[n.id] = el('text', { x: n.x + 9, y: n.y - 7, class: 'lbl' }, gLbl);
  labels[n.id].textContent = n.name.zh.replace(/（.*）/, '');
});

function placeLabels(order, size, show) { const boxes = [];
  order.forEach(({ n, t, dx, dy }) => { const w = t.textContent.length * size, b = [n.x + dx, n.y + dy - size, n.x + dx + w, n.y + dy];
    const ok = show(n) && !boxes.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    t.style.display = ok ? '' : 'none'; if (ok) boxes.push(b); }); }
function light(id) {
  consts.forEach((c) => c.e.classList.toggle('on', c.a === id || c.b === id));
  Object.entries(labels).forEach(([k, t]) => t.classList.toggle('on', k === id || byId[id].neighbors.includes(k)));
}
function paintStars() {
  const sc = D.scores[preset];
  D.nodes.forEach((n) => { const v = sc[n.id] / 100; const r = 2.5 + v * v * 10;
    stars[n.id].setAttribute('d', starPath(r)); stars[n.id].setAttribute('fill', n.id === sel ? '#c9472f' : `rgba(230,223,207,${.35 + v * .65})`);
    });
  placeLabels([...D.nodes].sort((a, b) => (b.id === sel) - (a.id === sel) || sc[b.id] - sc[a.id]).map((n) => ({ n, t: labels[n.id], dx: 9, dy: -7 })), 12, (n) => sc[n.id] > 55 || n.id === sel);
}

// ---- 命盘 ----
const detail = document.getElementById('detail');
function polar(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arc(cx, cy, r0, r1, a0, a1) {
  const [x0, y0] = polar(cx, cy, r1, a0), [x1, y1] = polar(cx, cy, r1, a1), [x2, y2] = polar(cx, cy, r0, a1), [x3, y3] = polar(cx, cy, r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
function renderDetail() {
  const n = byId[sel], score = D.scores[preset][sel];
  detail.innerHTML = `
    <div class="kicker">命 盘</div>
    <div class="title"><div><h2>${n.name.zh}</h2><div class="local">${n.name.local} · ${n.name.en}</div></div><div class="seal">${score}</div></div>
    <p class="vibe">${n.vibe}</p>
    <svg id="mandala" viewBox="0 0 340 300"></svg>
    <p class="vibe" style="margin-bottom:16px">风味和弦 · ${n.chord}</p>
    <div class="dishes">
      <div><h3>闭眼点</h3><ul>${n.safe.map((d) => `<li>${d.zh}<span>${d.local}</span></li>`).join('')}</ul></div>
      <div><h3 class="c">慎点</h3><ul>${n.caution.map((d) => `<li>${d.zh}<span>${d.why}</span></li>`).join('')}</ul></div>
    </div>`;
  const m = detail.querySelector('#mandala'), cx = 170, cy = 150, R0 = 34, R1 = 112, K = D.keys.length;
  for (let i = 1; i <= 5; i++) el('circle', { cx, cy, r: R0 + (R1 - R0) * i / 5, fill: 'none', stroke: 'rgba(230,223,207,.1)', 'stroke-dasharray': i === 5 ? '' : '1 3' }, m);
  D.keys.forEach((k, i) => {
    const a0 = -Math.PI / 2 + (i / K) * Math.PI * 2 + .04, a1 = a0 + Math.PI * 2 / K - .08, v = n.v[k] / 10;
    const p = el('path', { d: arc(cx, cy, R0, R0 + .01, a0, a1), fill: v > .65 ? '#c9472f' : '#c2a165', opacity: .35 + v * .6 }, m);
    requestAnimationFrame(() => { let t0; const step = (t) => { t0 ??= t; const e = Math.min(1, (t - t0) / 700), k2 = 1 - Math.pow(1 - e, 3);
      p.setAttribute('d', arc(cx, cy, R0, R0 + (R1 - R0) * v * k2 + .01, a0, a1)); e < 1 && requestAnimationFrame(step); }; requestAnimationFrame(step); });
    const am = (a0 + a1) / 2, [lx, ly] = polar(cx, cy, R1 + 16, am);
    const t = el('text', { x: lx, y: ly + 4, 'text-anchor': Math.abs(Math.cos(am)) < .3 ? 'middle' : Math.cos(am) > 0 ? 'start' : 'end', fill: '#a39d8f', 'font-size': 11, 'font-family': 'Noto Serif SC' }, m);
    t.textContent = D.labels[k];
  });
  const c = el('text', { x: cx, y: cy + 7, 'text-anchor': 'middle', fill: '#e6dfcf', 'font-size': 20, 'font-family': 'Noto Serif SC', 'font-weight': 900 }, m);
  c.textContent = n.name.zh.slice(0, 2);
}
function select(id) { sel = id; paintStars(); light(id); renderDetail(); }

// ---- 预设 ----
const nav = document.getElementById('presets');
D.presets.forEach((p) => { const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => { preset = p.id;
  nav.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); paintStars(); renderDetail(); }; nav.appendChild(b); });
nav.firstChild.setAttribute('aria-pressed', true);
select(sel);
</script>
</body>
</html>
